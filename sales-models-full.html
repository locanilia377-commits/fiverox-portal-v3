<noscript>Для пересчета и переключения моделей включите JavaScript.</noscript></main><script>const defaults = {
  base:200, confirmed:80, phoneTest:20, visitShare:100, days:22, visitsDay:5, reserve:0,
  meetTest:50, meetSale:20, held:50, afterTest:50, first:35000, monthly:100000,
  margin:20, bonus:2, manager:80000, travel:0, contactCost:0, initialManual:0,
  eligible:100, aiConfirm:80, aiPhone:20, aiReady:10, aiVisit:30, aiAccept:50,
  minutes:2.4, minutePrice:10, dev:100000, manualGoal:250000, aiGoal:250000,
  retention:75, refShare:10, refSales:20,
  partners:10, holdout:60, campaign:75, ads:50000, fee:20000, cpl:2500,
  extra:0, qualified:70, booking:50, service:70, avitoGoal:0
};
const pct=n=>n/100;
const div=(a,b)=>b>0?a/b:null;
const finite=n=>Number.isFinite(n);
const optimize=(evaluate,breakpoint,goal)=>{
  const stops=[0,...(finite(breakpoint)&&breakpoint>0?[breakpoint]:[]),1e8];
  for(let k=1;k<stops.length;k++){
    const min=stops[k-1],max=stops[k],lo=evaluate(min),hi=evaluate(max);
    if(Math.abs(lo-goal)<.00001)return min;
    if((goal-lo)*(goal-hi)>0 || lo===hi)continue;
    return min+(goal-lo)*(max-min)/(hi-lo);
  }
  return null;
};
function field(wanted, capacity, phone, x){
  const visits=Math.min(wanted,capacity);
  const meetingTests=visits*pct(x.meetTest), direct=visits*pct(x.meetSale);
  const scheduled=phone+meetingTests, completed=scheduled*pct(x.held);
  return {wanted,visits,meetingTests,direct,refused:visits-meetingTests-direct,
    scheduled,completed,testBuyers:completed*pct(x.afterTest)};
}
function economics(buyers,visits,inputSpend,initial,x) {
  const net=pct(x.margin-x.bonus), revenue=buyers*x.first, fixed=x.manager+visits*x.travel;
  return {buyers,revenue,net,margin:revenue*pct(x.margin),bonus:revenue*pct(x.bonus),
    fixed,inputSpend,operating:revenue*net-fixed-inputSpend,initial,payroll:x.manager,
    launch:revenue*net-fixed-inputSpend-initial,cac:div(fixed+inputSpend,buyers),
    matureTurnover:buyers*x.monthly,matureContribution:buyers*x.monthly*net,
    breakEven:div(fixed+inputSpend,x.first*net)};
}
function manual(x){
  const capacity=Math.floor(x.days*x.visitsDay*(1-pct(x.reserve)));
  const confirmed=x.base*pct(x.confirmed), phone=confirmed*pct(x.phoneTest);
  const wanted=(confirmed-phone)*pct(x.visitShare), f=field(wanted,capacity,phone,x);
  const full=field(wanted,Infinity,phone,x),paid=full.direct+full.testBuyers;
  return {...f,capacity,confirmed,phone,fullBuyers:paid,fullRevenue:paid*x.first,
    fullDays:div(wanted,x.visitsDay),firstValue:confirmed,
    ...economics(f.direct+f.testBuyers,f.visits,x.base*x.contactCost,x.initialManual,x)};
}
function ai(x){
  const capacity=Math.floor(x.days*x.visitsDay*(1-pct(x.reserve)));
  const allowed=x.base*pct(x.eligible),confirmed=allowed*pct(x.aiConfirm);
  const phone=confirmed*pct(x.aiPhone),ready=confirmed*pct(x.aiReady),hotBuyers=ready*pct(x.aiAccept);
  const f=field(confirmed*pct(x.aiVisit),capacity,phone,x);
  const minutes=allowed*x.minutes,calls=minutes*x.minutePrice;
  return {...f,capacity,allowed,confirmed,phone,ready,hotBuyers,minutes,calls,
    handoff:ready+phone+f.wanted,...economics(f.direct+f.testBuyers+hotBuyers,f.visits,calls,x.dev,x)};
}
function avito(x){
  const lead=div(x.ads,x.cpl)??0, cost=x.ads+x.fee, net=pct(x.margin-x.bonus);
  const qualified=lead*pct(x.qualified), booked=qualified*pct(x.booking), serviced=booked*pct(x.service);
  const retained=x.partners*pct(x.campaign), control=x.partners*pct(x.holdout);
  const extraPartners=retained-control, revenue=extraPartners*x.monthly+x.extra;
  const need=div(cost,net), needPartners=need===null?null:div(need-x.extra,x.monthly);
  return {lead,qualified,booked,serviced,cost,net,control,retained,extraPartners,revenue,
    operating:revenue*net-cost, fullCpl:div(cost,lead), need,
    needPartners:needPartners===null?null:Math.max(0,needPartners),
    requiredRetention:needPartners===null||x.partners<=0?null:pct(x.holdout)+needPartners/x.partners};
}
const calculators={manual,ai,avito};
function cohorts(type,x,m){
  const isPartner=type==='avito';
  return Array.from({length:6},(_,age)=>{
    const current=(isPartner?x.partners:m.buyers)*(pct(isPartner?x.campaign:x.retention)**age);
    const control=isPartner?x.partners*pct(x.holdout)**age:null;
    const revenue=isPartner?(current-control)*x.monthly+(age>0?x.extra:0):current*(age===0?x.first:x.monthly);
    const allocated=isPartner?m.cost:(age===0?m.fixed+m.inputSpend+m.initial:0);
    return {age,current,control,revenue,contribution:revenue*m.net,allocated,result:revenue*m.net-allocated};
  });
}
function khanin(type,x,m){
  const isAI=type==='ai', isPartner=type==='avito';
  const goal=x[type==='manual'?'manualGoal':isAI?'aiGoal':'avitoGoal'];
  const fullNeed=(isPartner?m.cost:m.fixed+m.inputSpend)+goal;
  const format=(label,unit,base,target,note)=>({label,unit,base,target:finite(target)&&target>=0?target:null,note});
  if(isPartner){
    const gap=pct(x.campaign-x.holdout), delta=m.extraPartners, need=div(fullNeed,m.net);
    const neededRet=need===null||x.partners*x.monthly<=0?null:pct(x.holdout)+(need-x.extra)/(x.partners*x.monthly);
    const price=need===null?null:div(need-x.extra,delta);
    const gross=div(fullNeed,m.revenue);
    const unitMargin=fullNeed<=0?0:gross===null?null:gross+pct(x.bonus);
    const fee=m.revenue*m.net-x.ads-goal;
    const cpl=div(m.revenue*m.net-x.fee-goal,m.lead);
    return [
      format("Студий в пилоте","шт",x.partners,need===null?null:div(need-x.extra,gap*x.monthly),"При текущем разрыве удержания и неизменном бюджете. Проверить, хватит ли лидов на студию."),
      format("Месячное удержание с Авито","%",x.campaign,neededRet===null||neededRet>1?null:Math.max(0,neededRet)*100,"Удержание контрольной группы фиксировано. Верхняя граница 100%."),
      format("Месячная закупка активной студии","₽",x.monthly,price,"При текущем количестве дополнительно удержанных студий."),
      format("Валовая маржа до премии","%",x.margin,unitMargin===null||unitMargin>1?null:unitMargin*100,"Премия остается процентом от выручки."),
      format("Максимальная стоимость ведения","₽",x.fee,fee,"Рекламный бюджет и объем закупок сохранены."),
      format("Прирост закупок сверх удержания","₽",x.extra,need===null?null:Math.max(0,need-delta*x.monthly),"Вносить только независимый прирост по выполненным работам."),
      format("Предельная цена рекламного лида","₽",x.cpl,cpl,"Плановое число лидов фиксировано, бюджет меняется вместе с CPL. Закупки фиксированы."),
    ];
  }
  const trafficRate=isAI?pct(x.eligible)*pct(x.aiConfirm)*pct(x.aiVisit):
    pct(x.confirmed)*(1-pct(x.phoneTest))*pct(x.visitShare);
  const evaluate=calculators[type];
  const baseTarget=optimize(n=>evaluate({...x,base:n}).operating,div(m.capacity,trafficRate),goal);
  const buyers=div(fullNeed,x.first*m.net);
  const conversion=m.buyers?div(buyers,x.base):buyers===null?null:div(buyers,x.base);
  const eligible=isAI?pct(x.eligible)*pct(x.aiConfirm):pct(x.confirmed);
  const targetPrice=div(fullNeed,m.buyers*m.net);
  const requiredMargin=div(fullNeed,m.revenue);
  const maxSalary=m.revenue*m.net-m.inputSpend-m.visits*x.travel-goal;
  const apc=div(fullNeed,m.revenue*m.net);
  const residual=m.revenue*m.net-m.fixed-goal;
  return [
    format("Входящая база","шт",x.base,baseTarget,"Конверсии сохранены, выезды ограничены, стоимость входа растет с базой."),
    format("База → первая покупка","%",x.base?100*m.buyers/x.base:null,conversion!==null&&conversion<=eligible?100*conversion:null,"Сквозная целевая конверсия. Проверить, какая ветка и мощность дадут прирост."),
    format("Чек первой закупки","₽",x.first,targetPrice,"Количество покупателей фиксировано, премия и валовая маржа пересчитываются."),
    format("Валовая маржа до премии","%",x.margin,requiredMargin===null||requiredMargin+pct(x.bonus)>1?null:100*(requiredMargin+pct(x.bonus)),"Удерживаем оборот и переменный процент премии."),
    format("Максимальный оклад на канал","₽",x.manager,maxSalary,"Остальные расходы и текущий объем сохранены."),
    format("Закупок на покупателя за период","×",1,apc,"Теоретический APC при том же чеке. Повтор должен быть оплачен в периоде."),
    format(isAI?"Предельная цена минуты ИИ":"Предельная цена входящей записи","₽",isAI?x.minutePrice:x.contactCost,div(residual,isAI?m.minutes:x.base),"Объем фиксирован. Это цена единицы трафика, а не CAC."),
  ];
}

  const driver=type==='avito'?'monthly':'first';
  const alternate=calculators[type]({...state,[driver]:state[driver]*1.10});
  return out+panel("Чувствительность и бюджет",table(["Условие","Результат"],[["Чек или месячная закупка +10%",r(alternate.operating)],["Изменение к базовому результату",r(alternate.operating-m.operating)],["Кассовый минимум расходов без учета закупки товара",r(type==='avito'?m.cost:m.fixed+m.inputSpend+m.initial)]])+note("Сальдо показано после перечисленных затрат. Для денежного календаря нужны сроки оплат, закупка товара, логистика, налоги и фактические условия. Неподтвержденные прямые расходы сейчас приняты за 0."));
}
function canvas(data){
  const blocks=data.canvas.map(q=>`<details class="block ${q.id}"><summary>${q.title}</summary><p>${q.what}</p><p><b>Метрика</b> · ${q.kpi}</p><p class="note">Проверка · ${q.check}</p></details>`);
  return '<div class="canvas">'+blocks.join('')+'</div>'+note('Девять блоков бизнес-модели. Osterwalder &amp; Pigneur / Strategyzer. Метрики отражают сценарий пилота.');
}
function customer(data){
  const v=data.vpc;
  const headings=["Не видит проблему","Видит проблему","Выбирает решение","Сравнивает поставщиков","Готов действовать"];
  return panel("Ценность для клиента",table(["Задача, барьер и выгода","Ответ в модели"],[[v.job,v.offer],[v.pain,v.relief],[v.gain,v.proof]])+note("Альтернатива · "+data.alternative))+
    panel("Лестница осведомленности",table(["Этап","Сообщение или действие"],headings.map((h,i)=>[h,data.ladder[i]])))+
    panel("Интервью с клиентами",list(data.interview)+note("8 интервью по 20 минут. Обсуждать прошлый опыт, фиксировать факты отдельным полем CRM. Опросы еще не проводились."));
}
function funnelValues(id,x,m){
  if(id==='avito')return [[m.lead,null],[m.qualified,m.lead],[m.serviced,m.booked],[m.retained,x.partners],[null,x.partners],[m.revenue,null]];
  const isAI=id==='ai';
  return [[isAI?m.allowed:x.base,x.base],[m.confirmed,isAI?m.allowed:x.base],
    [m.completed+m.direct+(m.hotBuyers||0),isAI?m.handoff:m.confirmed],
    [m.buyers*pct(x.retention),m.buyers],[m.buyers*pct(x.refShare)*pct(x.refSales),m.buyers],
    [m.buyers,isAI?m.handoff:m.confirmed]];
}
function funnel(data,m){
  const values=funnelValues(type,state,m);
  return '<div class="stage-grid">'+data.funnel.map(([stage,event,denom,when],i)=>{
    const [a,b]=values[i], money=type==='avito'&&i===5;
    return `<article class="box"><h3>${stage}</h3><strong>${money?r(a):f(a,2)}${b===null?'':' / '+f(b,2)}</strong><p>${event}</p><p class="note">${denom} · ${when}${b>0?' · '+percent(a===null?null:a/b):''}</p></article>`;
  }).join('')+'</div>'+note("Доля показывает условный переход для указанного знаменателя. Рекомендация считается по новому ИНН, повтор — по прежнему. Для Авито AAARRR связывает путь автовладельца и закупки студии двумя отдельными ID.");
}
const pretty=(v,unit)=>!finite(v)?'—':unit==='₽'?r(v,2):f(v,2)+' '+unit;
function goals(m){
  return panel("Семь целевых метрик Ханина",table(["Рычаг","Текущий","Целевой","При фиксированных условиях"],khanin(type,state,m).map(q=>[q.label,pretty(q.base,q.unit),pretty(q.target,q.unit),q.note]))+
  note("Чтобы сменить цель, откройте параметры модели. Прочерк означает отсутствие допустимого значения или положительного знаменателя. Цели показаны по одному рычагу. Для физических объемов округляйте вверх и проверяйте загрузку."));
}
function cohortView(m){
  const c=cohorts(type,state,m), sum=key=>c.reduce((a,b)=>a+b[key],0), base=type==='avito'?state.partners:m.buyers;
  const cac=type==='avito'?div(sum('allocated'),base):div(m.fixed+m.inputSpend+m.initial,base);
  return panel("Когорта · 6 месяцев",table(["Возраст","Активных","Контроль","Выручка","Вклад до выделенных затрат","Выделенные затраты","Итого"],c.map(z=>["М+"+z.age,f(z.current,2),f(z.control,2),r(z.revenue),r(z.contribution),r(z.allocated),r(z.result)]))+
    note(type==='avito'?"В М+0 бюджет расходуется до измерения удержания. Затем бюджет повторяется каждый месяц. Доходом считается разница между сопоставимыми когортами.":"В М+0 первая закупка. В М+1…5 месячный чек умножен на долю сохраненных клиентов. Полный CAC и разовая подготовка отнесены на входящую когорту один раз."))+
    panel("LTV на исходную студию",table(["Метрика","На студию"],[["LTV по выручке",r(div(sum('revenue'),base))],["LTV по вкладу",r(div(sum('contribution'),base))],["Затраты программы / полный CAC с запуском",r(cac)],["LTV после выделенных затрат",r(div(sum('result'),base))]])+
    note("Возрастные прогнозы используют постоянную условную вероятность повторной активности. Для факта используйте зрелые когорты CRM, незрелым месяцам не присваивайте ноль."));
}
function experimentView(data){
  const trials=data.experiments.map(e=>({e,ice:(+e[6]+ +e[7]+ +e[8])/3})).sort((a,b)=>b.ice-a.ice);
  return panel("Приоритеты ICE и протоколы HADI",table(["Тест","Влияние / уверенность / простота","ICE","Основание"],trials.map(({e,ice},i)=>[e[0]+" · "+e[1]+(i===0?" · первый":""),e.slice(6,9).join(" / "),f(ice,2),e[9]])))+
    trials.map(({e})=>`<details class="box"><summary>${e[0]} · ${e[1]}</summary><dl><dt>H · Гипотеза</dt><dd>${e[2]}</dd><dt>A · Действие</dt><dd>${e[3]}</dd><dt>D · Данные</dt><dd>${e[4]}</dd><dt>I · Решение</dt><dd>${e[5]} Факта пока нет. Решение — повторить, изменить или остановить по данным окна.</dd></dl></details>`).join('');
}
function execution(data){
  return panel("Пилот на 90 дней",table(["Окно","Ответственный","Результат и приемка"],data.execution)+note("Раз в неделю сверять воронку по ID: данные, отклонение, препятствие, следующее действие, ответственный и срок. Роли распределяются действующей командой. Бюджеты тестов согласуются владельцем канала."));
}
function sources(data){
  return panel("Паспорт и доступ к данным",list([data.scope,data.geo,data.unit,data.market,data.gaps]))+
    panel("Источники",table(["Материал · 21.11.2026","Что подтверждает"],data.sources.map(([t,url,q])=>[url?`<a href="${url}">${t}</a>`:t,q])));
}
function render(){
  const errors=[$('#parameters').querySelector('input:invalid')?"Проверьте значения и диапазоны.":"",
    state.meetTest+state.meetSale>100?'Исходы встречи превышают 100%.':'',
    state.aiPhone+state.aiReady+state.aiVisit>100?'Три статуса ИИ превышают 100%.':''].filter(Boolean);
  $('#status').textContent=errors.join(" ");
  $('#status').hidden=!errors.length;
  if(errors.length){$('#content').innerHTML='';return;}
  const data=model[type],m=calculators[type](state);
  const count=type==='avito'?m.lead:m.buyers;
  $('#kpi').innerHTML=[[type==='avito'?"Лидов студиям":"Первые покупатели",f(count,2)],["Выручка FIVEROX",r(m.revenue)],["Вклад после расходов канала",r(m.operating)]].map(([l,v])=>`<div><strong>${v}</strong><span>${l}</span></div>`).join('');
  $('#content').innerHTML=({overview:()=>overview(m),canvas:()=>canvas(data),customer:()=>customer(data),funnel:()=>funnel(data,m),
    goals:()=>goals(m),cohorts:()=>cohortView(m),experiments:()=>experimentView(data),execution:()=>execution(data),sources:()=>sources(data)})[view]();
}
function route(){
  const [a,b]=location.hash.slice(1).split('/');
  type=Object.hasOwn(labels,a)?a:'manual';view=Object.hasOwn(sections,b)?b:'overview';
  const data=model[type];
  $('#title').textContent=data.title;
  $('#scope').textContent=data.scope;
  $('#unit').textContent=data.unit;
  $('#params-unit').textContent=data.unit+" На исходных значениях "+(type==='avito'?'50 000 ₽ / 2 500 ₽ = 20 лидов.':'200 записей × 80% = 160 подтвержденных при допуске всей базы.');
  nav();inputs();render();
}
$('#parameters').addEventListener('submit',e=>e.preventDefault());
$('#parameters').addEventListener('input',e=>{
  const key=e.target.dataset.key;
  if(key&&e.target.validity.valid){
    const prev=state[key];state[key]=e.target.valueAsNumber;
    if((['meetTest','meetSale'].includes(key)&&state.meetTest+state.meetSale>100)||
       (['aiPhone','aiReady','aiVisit'].includes(key)&&state.aiPhone+state.aiReady+state.aiVisit>100)){
      state[key]=prev;e.target.setCustomValidity("Сумма долей превышает 100%.");
    }
  }
  render();
});
$('#parameters').addEventListener('beforeinput',e=>{if(e.target.dataset.key)e.target.setCustomValidity('');});
$('#parameters').addEventListener('reset',e=>{e.preventDefault();Object.assign(state,defaults);route();});
$('#export').addEventListener('click',()=>{
  const link=document.createElement('a');
  const url=URL.createObjectURL(new Blob([JSON.stringify({inputs:state,models:model},null,2)],{type:'application/json'}));
  link.href=url;link.download="FIVEROX_scenarios.json";link.click();setTimeout(()=>URL.revokeObjectURL(url),500);
});
window.addEventListener('hashchange',route);
route();
</script></body></html>
