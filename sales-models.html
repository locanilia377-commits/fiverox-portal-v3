<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIVEROX · Воронки продаж</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f2f7f5;color:#253a36;font:16px/1.45 system-ui,sans-serif}a{color:#0f4f4c}a:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid #a74700;outline-offset:3px}.wrap{max-width:1190px;margin:auto;padding:0 18px}header{background:#0f4f4c;color:white;padding:14px 0}header a{color:white}header div{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}main.wrap{padding-top:24px;padding-bottom:30px}h1{margin:0;font-size:clamp(2rem,5vw,3.2rem);line-height:1.15}h2,h3{margin:.25rem 0 .6rem}p,small{color:#4a625e}nav{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}nav a,button{padding:7px 11px;border:1px solid #c6d9d3;border-radius:6px;background:white;text-decoration:none;font:inherit;cursor:pointer}nav a[aria-current]{background:#0f4f4c;color:white}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.57fr);gap:12px;align-items:start}section,form{background:white;border:1px solid #cbdcd7;border-radius:10px;padding:14px;margin-bottom:10px}table{width:100%;border-collapse:collapse}td,th{padding:7px 0;border-bottom:1px solid #e1ebe8}td{text-align:right;min-width:62px}th{text-align:left;font-weight:540;padding-right:5px}fieldset{border:0;margin:0;padding:6px 0}legend{font-weight:700;color:#0f4f4c}label{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:4px 6px;align-items:center;font-size:.88rem;margin-bottom:7px}label small{grid-column:1/-1}input{width:100%;border:1px solid #95afa6;padding:4px;font:inherit;border-radius:4px}.form-bar{display:flex;justify-content:space-between;gap:9px;align-items:center}#message{color:#96330e}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><strong>FIVEROX</strong><a href="./business-system.html">Бизнес-модель дилерской сети</a></div></header><main class="wrap"><h1>Воронки продаж</h1><p>Три сценария продаж детейлинг-студиям. Настройте параметры, чтобы сравнить результаты.</p><nav aria-label="Модели"><a href="#manual">Обзвон и выезды</a><a href="#ai">ИИ-квалификация</a><a href="#avito">Авито для партнеров</a></nav><h2 id="name"></h2><div class="grid"><div id="result"></div><form id="inputs"><div class="form-bar"><h3>Параметры</h3><button type="reset">Сбросить</button></div><div id="fields"></div><p id="message" role="status"></p></form></div></main><script>function salesModels(x) {
 const per=v=>v/100, ratio=(a,b)=>b>0?a/b:null;
 const cap=x.days*x.visitsDay, net=per(x.margin-x.bonus);
 const economy=(buyers,visits,calls=0)=>{
  const firstRevenue=buyers*x.ticket,monthly=buyers*x.monthly,fixed=x.salary+visits*x.visitCost+calls;
  return {buyers,firstRevenue,monthly,fixed,firstMargin:firstRevenue*per(x.margin),commission:firstRevenue*per(x.bonus),
          result:firstRevenue*net-fixed,mature:monthly*net-fixed,cac:ratio(fixed,buyers),be:ratio(fixed,x.ticket*net)};
 };
 const field=(potential,limit,remote)=>{
  const visits=Math.min(potential,limit), meetingTest=visits*per(x.meetingTest),direct=visits*per(x.meetingSale),
        refused=visits*per(100-x.meetingTest-x.meetingSale), agreements=remote+meetingTest,
        completed=agreements*per(x.testHeld),testBuyers=completed*per(x.testBuyer);
  return {potential,visits,meetingTest,direct,refused,agreements,completed,testBuyers};
 };
 const confirmed=x.base*per(x.confirm),phone=confirmed*per(x.phone),
       allVisits=(confirmed-phone)*per(x.visitShare),f=field(allVisits,cap,phone),full=field(allVisits,Infinity,phone);
 const manual={confirmed,phone,cap,...f,...economy(f.direct+f.testBuyers,f.visits),
      fullBuyers:full.direct+full.testBuyers,fullRevenue:(full.direct+full.testBuyers)*x.ticket,
      fullDays:ratio(allVisits,x.visitsDay),remaining:allVisits-f.visits};
 const allowed=x.base*per(x.aiAllowed),qualified=allowed*per(x.aiConfirm),ready=qualified*per(x.aiReady),
       booked=qualified*per(x.aiPhone),visit=qualified*per(x.aiVisit),hotBuyers=ready*per(x.aiHotSale),
       fm=field(visit,cap,booked),minutes=allowed*x.minutes,calls=minutes*x.minutePrice,ar=economy(fm.direct+fm.testBuyers+hotBuyers,fm.visits,calls);
 const gain=ar.result-manual.result;
 const ai={allowed,qualified,ready,booked,visit,hotBuyers,...fm,...ar,leads:ready+booked+visit,minutes,calls,
     launch:ar.result-x.dev,allocated:ar.result-x.dev/x.devMonths,gain,releasedVisits:manual.visits-fm.visits,
     parity:ratio(manual.result+ar.fixed,x.ticket*net),payback:ratio(x.dev,gain)};
 const ads=x.ad+x.fee,leads=ratio(x.ad,x.cpl),ret0=per(x.ret0),ret1=per(x.ret1),
       extraPartners=x.partners*(ret1-ret0),sales=extraPartners*x.monthly+x.extra,
       breakeven=ratio(ads,net),requiredExtra=breakeven===null||!x.monthly?null:(breakeven-x.extra)/x.monthly;
 const six=r=>Array.from({length:6},(_,k)=>r**k).reduce((a,b)=>a+b,0);
 const avito={ads,leads,fullCpl:ratio(ads,leads),perPartner:ratio(leads,x.partners),extraPartners,sales,retentionLift:ret1-ret0,
    contribution:sales*net,result:sales*net-ads,breakeven,
    activeBE:requiredExtra===null?null:Math.max(0,requiredExtra),
    retentionBE:requiredExtra===null||!x.partners?null:Math.max(0,ret0+requiredExtra/x.partners),
    ltvDelta:x.monthly*net*(six(ret1)-six(ret0))};
 return {manual,ai,avito};
}
const base={"base":200,"confirm":80,"phone":20,"visitShare":100,"days":22,"visitsDay":5,"visitCost":0,"meetingTest":50,"meetingSale":20,"testHeld":50,"testBuyer":50,"ticket":35000,"monthly":100000,"margin":20,"bonus":2,"salary":80000,"aiAllowed":100,"aiConfirm":80,"aiPhone":20,"aiReady":10,"aiVisit":30,"aiHotSale":50,"minutes":2.4,"minutePrice":10,"dev":100000,"devMonths":6,"fee":20000,"ad":50000,"cpl":2500,"partners":10,"ret0":60,"ret1":75,"extra":0},groups={"manual":[["База и загрузка",[{"key":"base","label":"Точек в собственной CRM","value":200,"max":null,"note":"","min":0},{"key":"confirm","label":"База → подтвержденные точки, %","value":80,"max":100,"note":"","min":0},{"key":"phone","label":"Подтвержденная точка → тест по телефону, %","value":20,"max":100,"note":"","min":0},{"key":"visitShare","label":"Оставшиеся точки → визит, %","value":100,"max":100,"note":"Предел для расчета нагрузки. Долю состоявшихся визитов можно снизить.","min":0},{"key":"days","label":"Выездных дней в месяц","value":22,"max":31,"note":"Сценарий. Доступные дни после обзвона и сопровождения.","min":0},{"key":"visitsDay","label":"Визитов в день","value":5,"max":null,"note":"","min":0},{"key":"visitCost","label":"Расход на визит, ₽","value":0,"max":null,"note":"Добавьте транспортные расходы, если они есть.","min":0}]],["Тесты и покупки",[{"key":"meetingTest","label":"Встреча → тест, %","value":50,"max":100,"note":"","min":0},{"key":"meetingSale","label":"Встреча → покупка, %","value":20,"max":100,"note":"","min":0},{"key":"testHeld","label":"Договоренность → проведенный тест, %","value":50,"max":100,"note":"","min":0},{"key":"testBuyer","label":"Проведенный тест → покупка, %","value":50,"max":100,"note":"","min":0}]],["Экономика",[{"key":"ticket","label":"Первый заказ, ₽","value":35000,"max":null,"note":"","min":0},{"key":"monthly","label":"Закупка активной точки за месяц, ₽","value":100000,"max":null,"note":"","min":0},{"key":"margin","label":"Маржинальность, %","value":20,"max":100,"note":"","min":0},{"key":"bonus","label":"Премия от оборота, %","value":2,"max":100,"note":"","min":0},{"key":"salary","label":"Оклад за месяц, ₽","value":80000,"max":null,"note":"","min":0}]]],"ai":[["Допуск и квалификация",[{"key":"base","label":"Точек в собственной CRM","value":200,"max":null,"note":"","min":0},{"key":"aiAllowed","label":"Доля базы с допуском к обзвону, %","value":100,"max":100,"note":"100% — условие расчетного сценария. В модели учитывайте только подтвержденный допуск.","min":0},{"key":"aiConfirm","label":"Допущенные → подтвержденные точки, %","value":80,"max":100,"note":"","min":0},{"key":"aiPhone","label":"Подтвержденные → согласован тест, %","value":20,"max":100,"note":"","min":0},{"key":"aiReady","label":"Подтвержденные → готовы к покупке, %","value":10,"max":100,"note":"","min":0},{"key":"aiVisit","label":"Подтвержденные → нужен визит для теста, %","value":30,"max":100,"note":"Доли статусов — допущения. Три ветки не пересекаются.","min":0},{"key":"aiHotSale","label":"Готовый к покупке → оплатил, %","value":50,"max":100,"note":"","min":0},{"key":"minutes","label":"Тарифицируемых минут на допущенную запись","value":2.4,"max":null,"note":"Допущение, учитывающее недозвоны и короткие разговоры.","min":0},{"key":"minutePrice","label":"Тариф, ₽/мин","value":10,"max":null,"note":"","min":0},{"key":"dev","label":"Разработка разово, ₽","value":100000,"max":null,"note":"","min":0},{"key":"devMonths","label":"Распределить разработку на месяцев","value":6,"max":60,"note":"В первый месяц расходуется вся сумма.","min":1}]],["Выезды и исходы",[{"key":"days","label":"Выездных дней в месяц","value":22,"max":31,"note":"Сценарий. Доступные дни после обзвона и сопровождения.","min":0},{"key":"visitsDay","label":"Визитов в день","value":5,"max":null,"note":"","min":0},{"key":"visitCost","label":"Расход на визит, ₽","value":0,"max":null,"note":"Добавьте транспортные расходы, если они есть.","min":0},{"key":"meetingTest","label":"Встреча → тест, %","value":50,"max":100,"note":"","min":0},{"key":"meetingSale","label":"Встреча → покупка, %","value":20,"max":100,"note":"","min":0},{"key":"testHeld","label":"Договоренность → проведенный тест, %","value":50,"max":100,"note":"","min":0},{"key":"testBuyer","label":"Проведенный тест → покупка, %","value":50,"max":100,"note":"","min":0}]],["Экономика",[{"key":"ticket","label":"Первый заказ, ₽","value":35000,"max":null,"note":"","min":0},{"key":"monthly","label":"Закупка активной точки за месяц, ₽","value":100000,"max":null,"note":"","min":0},{"key":"margin","label":"Маржинальность, %","value":20,"max":100,"note":"","min":0},{"key":"bonus","label":"Премия от оборота, %","value":2,"max":100,"note":"","min":0},{"key":"salary","label":"Оклад за месяц, ₽","value":80000,"max":null,"note":"","min":0}]]],"avito":[["Один регион",[{"key":"fee","label":"Ведение кабинета, ₽/мес.","value":20000,"max":null,"note":"","min":0},{"key":"ad","label":"Рекламный бюджет, ₽/мес.","value":50000,"max":null,"note":"","min":0},{"key":"cpl","label":"Цена лида без ведения, ₽","value":2500,"max":null,"note":"","min":1},{"key":"partners","label":"Действующих студий в пилоте","value":10,"max":null,"note":"Допущение для примера.","min":0}]],["Удержание и выручка",[{"key":"ret0","label":"Удержание контрольной группы, %","value":60,"max":100,"note":"","min":0},{"key":"ret1","label":"Удержание с Авито, %","value":75,"max":100,"note":"Пример для проверки сценария. Фактический эффект оценивается по сопоставимой контрольной группе.","min":0},{"key":"extra","label":"Дополнительные закупки сверх эффекта удержания, ₽","value":0,"max":null,"note":"Учитывайте только прирост закупок, который еще не вошел в эффект удержания.","min":0},{"key":"monthly","label":"Закупка активной точки за месяц, ₽","value":100000,"max":null,"note":"","min":0},{"key":"margin","label":"Маржинальность, %","value":20,"max":100,"note":"","min":0},{"key":"bonus","label":"Премия от оборота, %","value":2,"max":100,"note":"","min":0}]]]};
(function(){
const $=id=>document.getElementById(id),f=$("inputs"),nav=[...document.querySelectorAll("nav a")];
const names={manual:"Ручной обзвон и выезды",ai:"ИИ-квалификация",avito:"Авито для партнеров"};
const n=(x,d=2)=>Number.isFinite(x)?x.toLocaleString("ru-RU",{maximumFractionDigits:d}):"—",r=x=>Number.isFinite(x)?n(x)+" ₽":"—",ceil=x=>x===null?"—":n(Math.ceil(x),0);
let x={...base},kind;
const display=(h,rows,note="")=>`<section><h3>${h}</h3><table>${rows.map(([key,val])=>`<tr><th scope="row">${key}</th><td>${val}</td></tr>`).join("")}</table>${note?`<p>${note}</p>`:""}</section>`;
const funnel=m=>[["Тесты, согласованные на встречах",n(m.meetingTest)],["Покупки без теста на встречах",n(m.direct)],["Отказы на встречах",n(m.refused)],["Тесты согласованы по всем веткам",n(m.agreements)],["Проведено тестов",n(m.completed)],["Купили после теста",n(m.testBuyers)],["Всего новых покупателей",n(m.buyers)]];
const finance=m=>[["Выручка первых заказов",r(m.firstRevenue)],["Маржа материала",r(m.firstMargin)],["Премия от оборота",r(m.commission)],["Оклад и дополнительные расходы",r(m.fixed)],["Результат по первым заказам",r(m.result)],["Стоимость покупателя",r(m.cac)],["Порог по первым покупателям",ceil(m.be)],["Закупки активной когорты в месяц",r(m.monthly)],["Месячный вклад активной когорты после расходов",r(m.mature)]];
function render(){
const error=f.querySelector("input:invalid")?"Проверьте значения.":kind!=="avito"&&x.meetingTest+x.meetingSale>100?"Доли исходов встречи превышают 100%.":kind==="ai"&&x.aiPhone+x.aiReady+x.aiVisit>100?"Доли квалифицированных статусов превышают 100%.":"";
$("message").textContent=error;$("result").hidden=!!error;if(error)return;
const m=salesModels(x)[kind];let result;
if(kind==="manual")result=display("База → собственная CRM → обзор менеджером → тест или визит",[
["Точки из парсинга",n(x.base)],["Подтверждены после холодного звонка",n(m.confirmed)],["Тесты согласованы по телефону",n(m.phone)],["Требуется визитов",n(m.potential)],["Визитов по доступной мощности",n(m.visits)],...funnel(m)],
"Числа с дробями показывают ожидаемый результат. Телефонные тесты, тесты после встречи и прямые покупки учтены без дублей.")+
display("Полная обработка базы",[["Выездных дней",ceil(m.fullDays)],["Новые покупатели",n(m.fullBuyers)],["Выручка первых заказов",r(m.fullRevenue)],["Визиты сверх месячной мощности",n(m.remaining)]],
"Тесты и оплаты могут перейти на следующий календарный месяц.")+display("Экономика",finance(m),
"Выручка первых заказов и месячные закупки активной когорты — разные срезы. Налоги и общехозяйственные расходы в результат не входят.");
else if(kind==="ai")result=display("Собственная CRM → ИИ → лиды на тест и покупку",[
["Точки с допуском к обзвону",n(m.allowed)],["Подтвержденные точки",n(m.qualified)],["Готовы к покупке",n(m.ready)],["Купили после передачи менеджеру",n(m.hotBuyers)],["Тест согласован по телефону",n(m.booked)],["Хотят тест, нужен визит",n(m.visit)],["Всего передано менеджеру",n(m.leads)],["Состоявшиеся визиты",n(m.visits)],...funnel(m)],
"Конверсии ИИ и длительность звонка — допущения. Передавайте в CRM статус, следующий шаг и причину отказа.")+
display("Расходы и сравнение с ручной моделью",[["Платные минуты",n(m.minutes)],["Звонки в месяц",r(m.calls)],["Разовая разработка",r(x.dev)],...finance(m),["После оплаты разработки в первом месяце",r(m.launch)],["Месяц с распределенной разработкой",r(m.allocated)],["Изменение результата относительно ручного варианта",r(m.gain)],["Освобожденные визиты",n(m.releasedVisits)],["Покупателей для паритета",ceil(m.parity)],["Окупаемость разработки из прироста к ручной модели",m.payback===null?"Не окупается при этих вводных":n(m.payback)+" мес."]],
"Высвобожденное время само по себе не уменьшает оклад.")+
'<section><p>Для массовых и автоматических вызовов требуется предварительное согласие. Автоматическое дозванивание для рекламы запрещено. <a href="https://www.consultant.ru/document/cons_doc_LAW_43224/b5a11e1f308ded9f4b94bf885bcf76ed577f9576/">Закон «О связи»</a> · <a href="https://www.garant.ru/products/ipo/prime/doc/409322841/">Руководство ФАС</a></p></section>';
else result=display("Авито → лиды автовладельцев → действующие студии",[
["Реклама",r(x.ad)],["Ведение",r(x.fee)],["Совокупные затраты",r(m.ads)],["Лидов",n(m.leads)],["Полная стоимость лида",r(m.fullCpl)],["Лидов на студию",n(m.perPartner)]])+
display("Удержание и вклад закупок",[
["Прирост удержания",n(m.retentionLift*100)+" п. п."],["Дополнительные активные студии",n(m.extraPartners)],["Инкрементальные закупки материала",r(m.sales)],["Вклад после премии",r(m.contribution)],["Результат за месяц после Авито",r(m.result)],["Дополнительный оборот до безубыточности",r(m.breakeven)],["Дополнительных активных студий для безубыточности",ceil(m.activeBE)],["Удержание для безубыточности",m.retentionBE===null?"—":n(m.retentionBE*100)+"%"],["Прирост вклада LTV на студию за 6 месяцев до бюджета Авито",r(m.ltvDelta)]],
"Пилот измеряет фактические закупки, активность студии и выполнение работ по лидам. Месячные проценты удержания — допущения. Для LTV сохранение активности моделируется шесть месяцев. Оклад действующей команды не начисляется повторно.");
$("result").innerHTML=result;
}
function route(){
const key=location.hash.slice(1);kind=Object.hasOwn(names,key)?key:"manual";$("name").textContent=names[kind];
nav.forEach(a=>a.hash==="#"+kind?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
$("fields").innerHTML=groups[kind].map(([h,items])=>`<fieldset><legend>${h}</legend>${items.map(q=>`<label for="${q.key}">${q.label}<input required step="any" type="number" id="${q.key}" value="${x[q.key]}" min="${q.min}" ${q.max===null?"":`max="${q.max}"`}>${q.note?`<small>${q.note}</small>`:""}</label>`).join("")}</fieldset>`).join("");render();
}
f.addEventListener("submit",e=>e.preventDefault());f.addEventListener("input",e=>{if(e.target.tagName==="INPUT"&&e.target.validity.valid)x[e.target.id]=e.target.valueAsNumber;render();});
f.addEventListener("reset",e=>{e.preventDefault();groups[kind].forEach(([,a])=>a.forEach(p=>x[p.key]=base[p.key]));route();});window.addEventListener("hashchange",route);route();
})();</script></body></html>
